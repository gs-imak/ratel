<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hors connexion | Ratel</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 32px 24px;
        text-align: center;
        background: linear-gradient(180deg, #d92028, #c11620 55%, #a91219);
        color: #fff;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      img { width: 88px; height: 88px; background: #fff; border-radius: 16px; padding: 8px; }
      h1 { font-size: 26px; margin: 6px 0 0; letter-spacing: 0.01em; }
      p { font-size: 15.5px; line-height: 1.6; color: rgba(255, 255, 255, 0.85); max-width: 30em; margin: 0; }
      button {
        margin-top: 8px;
        padding: 14px 26px;
        border: none;
        border-radius: 10px;
        background: #f5b301;
        color: #16110d;
        font-size: 15.5px;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <img src="/icons/icon-192.png" alt="Ratel" />
    <h1>Pas de connexion</h1>
    <p>
      Vous êtes hors ligne. Vérifiez votre connexion internet, la page se rechargera dès que le réseau
      sera revenu.
    </p>
    <button onclick="location.reload()">Réessayer</button>
    <script>
      /* The copy promises the page reloads by itself once the network is back,
         so make that true rather than weakening the promise. */
      window.addEventListener("online", function () {
        location.reload();
      });
    </script>
  </body>
</html>
